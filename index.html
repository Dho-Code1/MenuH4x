<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DNS Config Maker</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:360px;
    background:#1e293b;
    border-radius:18px;
    padding:20px;
    color:white;
    box-shadow:0 0 20px #0006;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

pre{
    margin-top:15px;
    background:#111827;
    padding:12px;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#22c55e;
}
</style>

</head>

<body>

<div class="box">

<h2>DNS Config Maker</h2>

<input id="name" placeholder="Tên cấu hình">

<input id="dns1" placeholder="DNS Chính (VD: 1.1.1.1)">

<input id="dns2" placeholder="DNS Phụ (VD: 8.8.8.8)">

<input id="doh" placeholder="DNS-over-HTTPS URL (tuỳ chọn)">

<button onclick="createConfig()">TẠO CẤU HÌNH</button>

<pre id="result"></pre>

</div>

<script>

function createConfig(){

const config={

Name:document.getElementById("name").value,

PrimaryDNS:document.getElementById("dns1").value,

SecondaryDNS:document.getElementById("dns2").value,

DoH:document.getElementById("doh").value,

Created:new Date().toLocaleString()

};

document.getElementById("result").textContent=
JSON.stringify(config,null,4);

}

</script>

</body>
</html>
