<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNS Config Maker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:#1f2937;
padding:20px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.4);
color:white;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#374151;
color:white;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

#create{
background:#2563eb;
color:white;
}

#download{
background:#16a34a;
color:white;
}

pre{
margin-top:15px;
background:#111;
padding:10px;
border-radius:10px;
white-space:pre-wrap;
word-break:break-word;
color:#22c55e;
font-size:13px;
}
</style>

</head>

<body>

<div class="card">

<h2>DNS Config Maker</h2>

<input id="name" placeholder="Tên cấu hình">

<input id="dns1" placeholder="DNS Chính">

<input id="dns2" placeholder="DNS Phụ">

<input id="doh" placeholder="DNS over HTTPS (không bắt buộc)">

<button id="create" onclick="createConfig()">Tạo cấu hình</button>

<button id="download" onclick="downloadConfig()">Tải file JSON</button>

<pre id="result">Chưa tạo cấu hình.</pre>

</div>

<script>

let currentConfig=null;

function createConfig(){

currentConfig={

name:document.getElementById("name").value,

primaryDNS:document.getElementById("dns1").value,

secondaryDNS:document.getElementById("dns2").value,

doh:document.getElementById("doh").value,

created:new Date().toLocaleString()

};

document.getElementById("result").textContent=
JSON.stringify(currentConfig,null,4);

}

function downloadConfig(){

if(currentConfig==null){
alert("Hãy tạo cấu hình trước.");
return;
}

const blob=new Blob(
[JSON.stringify(currentConfig,null,4)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=(currentConfig.name||"DNS_Config")+".json";

a.click();

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
